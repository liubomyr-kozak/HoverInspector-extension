<!doctype html><html><head><title>Shop</title><link rel="stylesheet" href="common.css"></head><body><nav><a href="shop.html">Shop</a><a href="form.html">Form</a><a href="app.html">App</a><a href="todo.html">Todo</a></nav>
<h1>Shop</h1>
<div role="tablist"><button role="tab" data-f="all">All items</button><button role="tab" data-f="even">Even items</button><button role="tab" data-f="odd">Odd items</button></div>
<p>Cart: <span id="cart">0</span></p>
<div class="grid" id="grid"></div>
<script>
let cart=0;
function render(f){const g=document.getElementById('grid');g.innerHTML='';
for(let i=1;i<=24;i++){if(f==='even'&&i%2)continue;if(f==='odd'&&!(i%2))continue;
const c=document.createElement('div');c.className='card';
c.innerHTML='<a href="product.html?id='+i+'"><span>Product '+i+'</span></a><br><div class="icon-btn" role="button" aria-label="Add product '+i+'"><svg width="14" height="14"><path d="M2 7h10M7 2v10" stroke="black"/></svg></div>';
g.appendChild(c);}}
render('all');
document.addEventListener('click',e=>{const t=e.target.closest('[role=tab]');if(t)render(t.dataset.f);
const b=e.target.closest('.icon-btn');if(b){cart++;document.getElementById('cart').textContent=cart;}});
</script></body></html>
