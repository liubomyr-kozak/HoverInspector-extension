<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>WebRTC File Transfer (без сервера)</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        textarea { width: 100%; height: 120px; margin-bottom: 10px; }
        button { margin: 5px 0; }
        #status { margin: 10px 0; font-weight: bold; }
    </style>
</head>
<body>

<h2>📤 Передача файлу через WebRTC (ручна сигналізація)</h2>

<input type="file" id="fileInput"><br>
<button onclick="createOffer()">1. Створити Offer (ініціатор)</button>
<button onclick="acceptOffer()">2. Прийняти Offer → створити Answer</button>
<button onclick="acceptAnswer()">3. Прийняти Answer</button>

<div id="status">⏳ Статус: очікування</div>

<label>SDP Вихід (скопіюй і передай іншому):</label>
<textarea id="localSDP" readonly></textarea>

<label>SDP Ввід (встав від іншого):</label>
<textarea id="remoteSDP"></textarea>

<a id="downloadLink" style="display:none">⬇️ Завантажити файл</a>

<script>
    let pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    });

    let dataChannel;
    let receivedChunks = [];
    let fileName = 'received_file';

    function log(msg) {
        document.getElementById('status').textContent = "📡 " + msg;
    }

    function createOffer() {
        dataChannel = pc.createDataChannel("file");

        setupDataChannel();

        pc.onicecandidate = e => {
            if (!e.candidate) {
                document.getElementById('localSDP').value = JSON.stringify(pc.localDescription);
            }
        };

        pc.createOffer().then(offer => pc.setLocalDescription(offer));
    }

    function acceptOffer() {
        let offer = JSON.parse(document.getElementById('remoteSDP').value);
        pc.ondatachannel = e => {
            dataChannel = e.channel;
            setupDataChannel();
        };

        pc.setRemoteDescription(offer).then(() => pc.createAnswer())
            .then(answer => pc.setLocalDescription(answer));

        pc.onicecandidate = e => {
            if (!e.candidate) {
                document.getElementById('localSDP').value = JSON.stringify(pc.localDescription);
            }
        };
    }

    function acceptAnswer() {
        let answer = JSON.parse(document.getElementById('remoteSDP').value);
        pc.setRemoteDescription(answer);
    }

    function setupDataChannel() {
        dataChannel.onopen = () => {
            log("З'єднання встановлено ✅");

            // Якщо відправник — відправити файл
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                fileName = file.name;
                const chunkSize = 16 * 1024;
                let offset = 0;

                log("📤 Передача: " + file.name);

                function sendChunk() {
                    const slice = file.slice(offset, offset + chunkSize);
                    slice.arrayBuffer().then(buf => {
                        dataChannel.send(buf);
                        offset += chunkSize;
                        if (offset < file.size) {
                            setTimeout(sendChunk, 0);
                        } else {
                            dataChannel.send("EOF");
                            log("✅ Файл надіслано");
                        }
                    });
                }

                sendChunk();
            }
        };

        dataChannel.onmessage = e => {
            if (e.data === "EOF") {
                const blob = new Blob(receivedChunks);
                const url = URL.createObjectURL(blob);
                const link = document.getElementById('downloadLink');
                link.href = url;
                link.download = fileName;
                link.textContent = "⬇️ Завантажити " + fileName;
                link.style.display = 'block';
                log("✅ Файл отримано");
                receivedChunks = [];
            } else {
                receivedChunks.push(e.data);
            }
        };
    }
</script>

</body>
</html>
