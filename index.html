<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="icon" type="image/png" href="/public/icon/android-chrome-512x512.png">
    <style>
        .hover,
        .selected {
            position: absolute;
            height: 220px;
            width: 220px;
        }

        .hover {
            box-shadow: 0 0 0 2px rgba(11, 249, 2, 0.13);
        }

        .border {
            border: 1px solid blue;
        }

        .border-with-width {
            border: 1px solid blue;
            border-right-width: 2px;
        }

        .selected {
            box-shadow: 0 0 0 2px rgba(175, 176, 183, 0.28);
            padding: 20px;
            margin: 10px;
        }

        .bg-red {
            background: red;
        }

        .bg-black {
            background: black;
        }

        html,
        body {
            /*height: 100%;*/
            min-height: 100%;
            height: 2000px;
            position: relative;
        }
        
        /* Button hover and click effects */
        button {
            transition: all 0.3s ease;
        }
        
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        button:active {
            opacity: 0.8;
            background-color: rgba(0, 0, 0, 0.1);
            transform: translateY(0);
        }
        
        /* Exceptions for special buttons */
        button[style*="cursor: not-allowed"]:hover,
        button[style*="cursor: not-allowed"]:active {
            transform: none;
            opacity: 0.7;
            background-color: inherit;
        }
        
        /* Exception for 3D button to preserve its effect */
        button[style*="box-shadow: 0 5px 0"]:hover {
            transform: none;
        }
        
        /* Ensure colored buttons maintain their color scheme on click */
        button[style*="background-color"]:active {
            filter: brightness(0.9);
            background-color: inherit !important;
        }
    </style>
</head>
<body>

<div id="root"></div>

<!-- Button Style Showcase -->
<div style="margin: 550px 0 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px;">
    <h3>15 Button Styles Showcase</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 15px;">
        <!-- Button 1: Basic with primary color -->
        <button style="background-color: #4285f4; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Primary Button</button>
        
        <!-- Button 2: Outlined style -->
        <button style="background-color: transparent; color: #4285f4; border: 2px solid #4285f4; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Outlined Button</button>
        
        <!-- Button 3: Rounded with shadow -->
        <button style="background-color: #34a853; color: white; border: none; padding: 10px 20px; border-radius: 25px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); cursor: pointer;">Rounded Button</button>
        
        <!-- Button 4: Text button -->
        <button style="background-color: transparent; color: #ea4335; border: none; padding: 10px 20px; text-decoration: underline; cursor: pointer;">Text Button</button>
        
        <!-- Button 5: Large button -->
        <button style="background-color: #fbbc05; color: #333; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 4px; cursor: pointer;">Large Button</button>
        
        <!-- Button 6: Small icon-like button -->
        <button style="background-color: #ea4335; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-weight: bold; cursor: pointer;">+</button>
        
        <!-- Button 7: Gradient background -->
        <button style="background: linear-gradient(to right, #4285f4, #34a853); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Gradient Button</button>
        
        <!-- Button 8: With border and hover effect -->
        <button style="background-color: white; color: #333; border: 1px solid #ccc; padding: 10px 20px; border-radius: 4px; cursor: pointer; transition: all 0.3s ease;" onmouseover="this.style.backgroundColor='#f5f5f5'" onmouseout="this.style.backgroundColor='white'">Hover Effect</button>
        
        <!-- Button 9: Disabled style -->
        <button style="background-color: #cccccc; color: #666666; border: none; padding: 10px 20px; border-radius: 4px; cursor: not-allowed; opacity: 0.7;">Disabled Button</button>
        
        <!-- Button 10: With icon (using text symbol) -->
        <button style="background-color: #673ab7; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">🔍 Search</button>
        
        <!-- Button 11: Fancy with multiple borders -->
        <button style="background-color: white; color: #ff6d00; border: 2px solid #ff6d00; outline: 1px solid #ffab40; outline-offset: 3px; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Fancy Border</button>
        
        <!-- Button 12: Glass morphism style -->
        <button style="background-color: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px); color: #333; border: 1px solid rgba(255, 255, 255, 0.18); padding: 10px 20px; border-radius: 8px; box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2); cursor: pointer;">Glass Button</button>
        
        <!-- Button 13: 3D effect -->
        <button style="background-color: #2196f3; color: white; border: none; padding: 10px 20px; border-radius: 4px; box-shadow: 0 5px 0 #0b7dda; cursor: pointer; position: relative; top: 0;" onmousedown="this.style.top='5px'; this.style.boxShadow='none';" onmouseup="this.style.top='0'; this.style.boxShadow='0 5px 0 #0b7dda';">3D Button</button>
        
        <!-- Button 14: Neon glow -->
        <button style="background-color: #111; color: #fff; border: 2px solid #0ff; padding: 10px 20px; border-radius: 4px; box-shadow: 0 0 10px #0ff, 0 0 20px #0ff; text-shadow: 0 0 5px #0ff; cursor: pointer;">Neon Button</button>
        
        <!-- Button 15: Retro pixel style -->
        <button style="background-color: #222; color: #33ff33; border: 3px solid #33ff33; padding: 10px 20px; font-family: monospace; text-transform: uppercase; cursor: pointer; image-rendering: pixelated;">Retro Button</button>
    </div>
</div>

<!-- Test Components for Save Recorded Scenario -->
<div style="margin: 30px 0; padding: 20px; border: 1px solid #4285f4; border-radius: 8px; background-color: #f8f9fa;">
    <h2 style="color: #4285f4; margin-bottom: 20px;">Test Components for Save Recorded Scenario</h2>
    
    <!-- Form with various input fields -->
    <form id="test-form" style="margin-bottom: 30px;">
        <h3>Form Elements</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
            <!-- Text input -->
            <div style="flex: 1; min-width: 200px;">
                <label for="text-input" style="display: block; margin-bottom: 5px; font-weight: bold;">Text Input:</label>
                <input type="text" id="text-input" name="text-input" placeholder="Enter text here" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <!-- Email input -->
            <div style="flex: 1; min-width: 200px;">
                <label for="email-input" style="display: block; margin-bottom: 5px; font-weight: bold;">Email Input:</label>
                <input type="email" id="email-input" name="email-input" placeholder="Enter email" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <!-- Password input -->
            <div style="flex: 1; min-width: 200px;">
                <label for="password-input" style="display: block; margin-bottom: 5px; font-weight: bold;">Password Input:</label>
                <input type="password" id="password-input" name="password-input" placeholder="Enter password" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
        </div>
        
        <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
            <!-- Number input -->
            <div style="flex: 1; min-width: 200px;">
                <label for="number-input" style="display: block; margin-bottom: 5px; font-weight: bold;">Number Input:</label>
                <input type="number" id="number-input" name="number-input" min="0" max="100" value="50" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <!-- Date input -->
            <div style="flex: 1; min-width: 200px;">
                <label for="date-input" style="display: block; margin-bottom: 5px; font-weight: bold;">Date Input:</label>
                <input type="date" id="date-input" name="date-input" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <!-- Color input -->
            <div style="flex: 1; min-width: 200px;">
                <label for="color-input" style="display: block; margin-bottom: 5px; font-weight: bold;">Color Input:</label>
                <input type="color" id="color-input" name="color-input" value="#4285f4" style="width: 100%; height: 40px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
        </div>
        
        <!-- Textarea -->
        <div style="margin-bottom: 20px;">
            <label for="textarea" style="display: block; margin-bottom: 5px; font-weight: bold;">Textarea:</label>
            <textarea id="textarea" name="textarea" rows="4" placeholder="Enter your message here" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
        </div>
        
        <!-- Checkbox group -->
        <div style="margin-bottom: 20px;">
            <p style="font-weight: bold; margin-bottom: 5px;">Checkbox Group:</p>
            <div style="display: flex; flex-wrap: wrap; gap: 15px;">
                <label style="display: flex; align-items: center;">
                    <input type="checkbox" name="checkbox-option" value="option1">
                    <span style="margin-left: 5px;">Option 1</span>
                </label>
                <label style="display: flex; align-items: center;">
                    <input type="checkbox" name="checkbox-option" value="option2">
                    <span style="margin-left: 5px;">Option 2</span>
                </label>
                <label style="display: flex; align-items: center;">
                    <input type="checkbox" name="checkbox-option" value="option3">
                    <span style="margin-left: 5px;">Option 3</span>
                </label>
            </div>
        </div>
        
        <!-- Radio button group -->
        <div style="margin-bottom: 20px;">
            <p style="font-weight: bold; margin-bottom: 5px;">Radio Button Group:</p>
            <div style="display: flex; flex-wrap: wrap; gap: 15px;">
                <label style="display: flex; align-items: center;">
                    <input type="radio" name="radio-option" value="option1">
                    <span style="margin-left: 5px;">Option 1</span>
                </label>
                <label style="display: flex; align-items: center;">
                    <input type="radio" name="radio-option" value="option2">
                    <span style="margin-left: 5px;">Option 2</span>
                </label>
                <label style="display: flex; align-items: center;">
                    <input type="radio" name="radio-option" value="option3">
                    <span style="margin-left: 5px;">Option 3</span>
                </label>
            </div>
        </div>
        
        <!-- Select dropdown -->
        <div style="margin-bottom: 20px;">
            <label for="select-dropdown" style="display: block; margin-bottom: 5px; font-weight: bold;">Select Dropdown:</label>
            <select id="select-dropdown" name="select-dropdown" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                <option value="">-- Select an option --</option>
                <option value="option1">Option 1</option>
                <option value="option2">Option 2</option>
                <option value="option3">Option 3</option>
                <option value="option4">Option 4</option>
            </select>
        </div>
        
        <!-- Submit button -->
        <button type="submit" style="background-color: #4285f4; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Submit Form</button>
        <button type="reset" style="background-color: #ea4335; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-left: 10px;">Reset Form</button>
    </form>
    
    <!-- Sliders section -->
    <div style="margin-bottom: 30px;">
        <h3>Sliders</h3>
        
        <!-- Basic slider -->
        <div style="margin-bottom: 15px;">
            <label for="basic-slider" style="display: block; margin-bottom: 5px; font-weight: bold;">Basic Slider:</label>
            <input type="range" id="basic-slider" name="basic-slider" min="0" max="100" value="50" style="width: 100%;">
            <div style="display: flex; justify-content: space-between;">
                <span>0</span>
                <span>50</span>
                <span>100</span>
            </div>
        </div>
        
        <!-- Slider with output -->
        <div style="margin-bottom: 15px;">
            <label for="slider-with-output" style="display: block; margin-bottom: 5px; font-weight: bold;">Slider with Output: <span id="slider-output">50</span></label>
            <input type="range" id="slider-with-output" name="slider-with-output" min="0" max="100" value="50" style="width: 100%;" oninput="document.getElementById('slider-output').textContent = this.value">
        </div>
        
        <!-- Stepped slider -->
        <div style="margin-bottom: 15px;">
            <label for="stepped-slider" style="display: block; margin-bottom: 5px; font-weight: bold;">Stepped Slider (step=10):</label>
            <input type="range" id="stepped-slider" name="stepped-slider" min="0" max="100" step="10" value="50" style="width: 100%;">
        </div>
    </div>
    
    <!-- Modal section -->
    <div style="margin-bottom: 30px;">
        <h3>Modal Dialog</h3>
        <button id="open-modal-btn" style="background-color: #673ab7; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Open Modal</button>
        
        <!-- Modal (hidden by default) -->
        <div id="test-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
            <div style="background-color: white; padding: 20px; border-radius: 8px; max-width: 500px; width: 90%; position: relative;">
                <button id="close-modal-btn" style="position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 20px; cursor: pointer;">×</button>
                <h3 style="margin-top: 0;">Modal Dialog</h3>
                <p>This is a test modal dialog for recording interactions.</p>
                <div style="margin: 20px 0;">
                    <label for="modal-input" style="display: block; margin-bottom: 5px; font-weight: bold;">Input in Modal:</label>
                    <input type="text" id="modal-input" name="modal-input" placeholder="Enter text here" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button id="modal-cancel-btn" style="background-color: #ccc; color: #333; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Cancel</button>
                    <button id="modal-confirm-btn" style="background-color: #4285f4; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Confirm</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- JavaScript for modal functionality -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('test-modal');
            const openModalBtn = document.getElementById('open-modal-btn');
            const closeModalBtn = document.getElementById('close-modal-btn');
            const modalCancelBtn = document.getElementById('modal-cancel-btn');
            const modalConfirmBtn = document.getElementById('modal-confirm-btn');
            
            // Open modal
            openModalBtn.addEventListener('click', function() {
                modal.style.display = 'flex';
            });
            
            // Close modal functions
            function closeModal() {
                modal.style.display = 'none';
            }
            
            closeModalBtn.addEventListener('click', closeModal);
            modalCancelBtn.addEventListener('click', closeModal);
            modalConfirmBtn.addEventListener('click', function() {
                alert('Modal confirmed with input: ' + document.getElementById('modal-input').value);
                closeModal();
            });
            
            // Close modal when clicking outside
            modal.addEventListener('click', function(event) {
                if (event.target === modal) {
                    closeModal();
                }
            });
            
            // Prevent form submission (for testing purposes)
            document.getElementById('test-form').addEventListener('submit', function(event) {
                event.preventDefault();
                alert('Form submitted!');
            });
        });
    </script>
</div>
